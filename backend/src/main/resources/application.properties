# ---------- Database settings ----------
# These values can be changed using environment variables (DB_URL, DB_USER, DB_PASS)
# NOTE: put your own mysql password in DB_PASS, do not write it here
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mams?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Robin}

# hibernate will create/update the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- JWT settings ----------
# secret key used to sign the login token (must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:change-me-please-change-me-32-bytes-min!!}

# ---------- Server settings ----------
server.port=${PORT:8080}
server.error.include-message=always
